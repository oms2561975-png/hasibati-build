name: Build Hasibati Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -q "حاسبتي_Android_4.1_الحاسبات_الموسعة.zip" -d android-project
          find android-project -maxdepth 3 -type f | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find android-project -type f -name "*.apk" -exec cp {} apk-output/ \;
          ls -lah apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hasibati-apk
          path: apk-output/*.apk
          if-no-files-found: error
