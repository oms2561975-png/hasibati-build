name: Import Hasibati ZIP and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Hasibati 4.1
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/hasibati-update
          unzip -q "$ZIP_FILE" -d /tmp/hasibati-update

          cp -a /tmp/hasibati-update/. .

          echo "Hasibati 4.1 project extracted successfully."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasibati-Android-4.1
          path: app/build/outputs/apk/debug/app-debug.apk
